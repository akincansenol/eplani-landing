<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPLANI — Brand Systems & Digital Experiences</title>
<meta name="description" content="EPLANI is a creation and structuring laboratory. Building systems, identities and digital experiences through clarity, structure and execution.">

<style>
/* ==========================================================================
   1. COLOR SYSTEM & BRAND FOUNDATION
   ========================================================================== */
:root {
    --bg-color: #FAF9F5;
    --text-primary: #1A1A1A;
    --text-muted: rgba(26, 26, 26, 0.45);
    --wordmark-color: #333333;
    --grid-line: rgba(85, 85, 85, 0.05);
    --brand-orange: #F3861F;
    --mind-text: #FAF9F5;
    --lang-color: rgba(26, 26, 26, 0.45);
    --lang-active: #1A1A1A;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg-color: #050608;
        --text-primary: #FAF9F5;
        --text-muted: rgba(250, 249, 245, 0.45);
        --wordmark-color: #FAF9F5;
        --grid-line: rgba(250, 249, 245, 0.04);
        --lang-color: rgba(250, 249, 245, 0.45);
        --lang-active: #FAF9F5;
    }
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Mono", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

@media(max-width: 768px) {
    html, body {
        overflow-y: auto;
    }
}

/* ==========================================================================
   LANGUAGE TOGGLE CONTROL
   ========================================================================== */
.lang-toggle {
    position: fixed;
    top: 5vh;
    right: 6vw;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
}

.lang-btn {
    background: none;
    border: none;
    color: var(--lang-color);
    cursor: pointer;
    padding: 4px 6px;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    transition: color 0.3s ease;
}

.lang-btn.active {
    color: var(--lang-active);
    font-weight: 600;
}

.lang-btn:hover {
    color: var(--lang-active);
}

.lang-divider {
    color: var(--lang-color);
    opacity: 0.5;
}

body.in-mind-space .lang-btn {
    color: rgba(250, 249, 245, 0.5);
}
body.in-mind-space .lang-btn.active,
body.in-mind-space .lang-btn:hover {
    color: #FAF9F5;
}
body.in-mind-space .lang-divider {
    color: rgba(250, 249, 245, 0.4);
}

/* ==========================================================================
   2. MAIN STAGE
   ========================================================================== */
.brand-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ==========================================================================
   3. GROUNDED HUD TYPOGRAPHY
   ========================================================================== */
.hud-container {
    position: absolute;
    bottom: 22vh;
    left: 8vw;
    z-index: 25;
    pointer-events: none;
    width: clamp(320px, 55vw, 780px);
    opacity: 0;
    transform: translateY(10px);
}

.hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.hud-meta {
    font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand-orange);
    display: flex;
    align-items: center;
    gap: 8px;
}

.hud-meta::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    background-color: var(--brand-orange);
    border-radius: 50%;
}

.hud-status {
    font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    text-transform: uppercase;
}

.hud-body {
    min-height: 70px;
    display: block;
}

.hud-text {
    font-size: clamp(20px, 2.2vw, 32px);
    line-height: 1.5;
    letter-spacing: -0.015em;
    color: var(--text-primary);
    font-weight: 350;
    white-space: pre-wrap;
    display: inline;
}

.type-cursor {
    display: inline-block;
    width: 8px;
    height: 1.15em;
    background-color: var(--brand-orange);
    margin-left: 4px;
    vertical-align: -0.15em;
    opacity: 0;
}

.type-cursor.active {
    opacity: 1;
    animation: blink 0.8s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

/* ==========================================================================
   4. BLUEPRINT GRID & CANVAS
   ========================================================================== */
.blueprint-grid {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0;
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
}

#data-canvas {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

/* ==========================================================================
   5. EPLANI VECTOR SYMBOL
   ========================================================================== */
#eplani-svg {
    position: absolute;
    width: 80%;
    max-width: 1100px;
    height: auto;
    z-index: 30;
    overflow: visible;
    opacity: 0;
}

.brand-path {
    fill: var(--wordmark-color);
    fill-opacity: 0;
    stroke: var(--wordmark-color);
    stroke-width: 2px;
    stroke-linejoin: round;
    stroke-linecap: round;
}

#signature-dot {
    transform-origin: center;
}

/* EXPANDING ORANGE PORTAL SPHERE */
#orange-portal-sphere {
    position: fixed;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: var(--brand-orange);
    z-index: 38;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(1);
}

/* ==========================================================================
   6. THE MIND SPACE OVERLAY
   ========================================================================== */
.mind-space-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background-color: #F3861F !important;
    color: #FAF9F5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    opacity: 0;
    visibility: hidden;
    text-align: center;
}

.mind-relocated-logo {
    position: absolute;
    bottom: 6vh;
    right: 6vw;
    width: clamp(130px, 16vw, 190px);
    height: auto;
    opacity: 0;
    transform: translateY(12px);
    z-index: 45;
}

.mind-content {
    max-width: 820px;
    text-align: center;
    padding: 0 20px;
}

.mind-text {
    font-size: clamp(24px, 2.8vw, 36px);
    font-weight: 300;
    line-height: 1.55;
    letter-spacing: -0.015em;
    color: #FAF9F5 !important;
    display: inline;
    white-space: pre-wrap;
}

.mind-cursor {
    background-color: #FAF9F5 !important;
}

.mind-cta-wrap {
    margin-top: 45px;
    opacity: 0;
    transform: translateY(16px);
}

.mind-cta-text {
    font-size: clamp(17px, 1.6vw, 22px);
    font-weight: 300;
    line-height: 1.6;
    letter-spacing: -0.01em;
    color: rgba(250, 249, 245, 0.92);
}

.mind-action {
    display: inline-block;
    margin-top: 18px;
    color: #FAF9F5;
    text-decoration: none;
    font-size: 19px;
    font-weight: 450;
    border-bottom: 1px solid rgba(250, 249, 245, 0.6);
    padding-bottom: 4px;
    transition: border-color 0.3s ease, transform 0.3s ease;
}

.mind-action:hover {
    border-color: rgba(250, 249, 245, 1);
    transform: translateY(-2px);
}

.replay-btn {
    position: absolute;
    bottom: 6vh;
    left: 6vw;
    font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(250, 249, 245, 0.6);
    background: none;
    border: none;
    cursor: pointer;
    transition: color 0.3s ease;
    z-index: 50;
}

.replay-btn:hover {
    color: #FAF9F5;
}
</style>

let currentLang = 'en';

/* ==========================================================================
   CONFIG & ENGINE
   ========================================================================== */
const CONFIG = {
    brandColor: "#F3861F",
    particleCount: 160,
    gridSize: 40,
    coords: {
        epDot: { x: 798.97333, y: 382.64856 },
        finalDot: { x: 1202.9733, y: 382.64856 }
    }
};

const canvas = document.getElementById("data-canvas");
const ctx = canvas.getContext("2d");

let width, height;
let nodes = [];
let isDrifting = true;
let masterTL = null;

function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    const offsetX = (width / 2) % CONFIG.gridSize;
    const offsetY = (height / 2) % CONFIG.gridSize;

    document.getElementById("blueprint-grid").style.backgroundPosition = `${offsetX}px ${offsetY}px`;
}

function getPointInScreenPixels(svgX, svgY) {
    const svg = document.getElementById("eplani-svg");
    const group = document.getElementById("eplani-logo-group");
    
    if (svg && group && group.getScreenCTM) {
        const ctm = group.getScreenCTM();
        if (ctm && (ctm.e !== 0 || ctm.f !== 0 || ctm.a !== 0)) {
            const pt = svg.createSVGPoint();
            pt.x = svgX;
            pt.y = svgY;
            const screenPt = pt.matrixTransform(ctm);
            if (screenPt.x > 0 && screenPt.y > 0) {
                return { x: screenPt.x, y: screenPt.y };
            }
        }
    }
    
    const rect = svg.getBoundingClientRect();
    const viewBoxWidth = 2070.0582;
    const viewBoxHeight = 651.93796;
    const viewBoxAspect = viewBoxWidth / viewBoxHeight;
    const rectAspect = rect.width / rect.height;
    
    let renderWidth = rect.width;
    let offsetX = rect.left;
    let offsetY = rect.top;
    
    if (rectAspect > viewBoxAspect) {
        renderWidth = rect.height * viewBoxAspect;
        offsetX = rect.left + (rect.width - renderWidth) / 2;
    } else {
        const renderHeight = rect.width / viewBoxAspect;
        offsetY = rect.top + (rect.height - renderHeight) / 2;
    }
    
    const scale = renderWidth / viewBoxWidth;
    return {
        x: offsetX + (svgX + 121.99984) * scale,
        y: offsetY + (svgY + 29.28959) * scale
    };
}

class SignalNode {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.vy = (Math.random() - 0.5) * 0.2;

        const rand = Math.random();
        if (rand < 0.40) {
            this.radius = Math.random() * 0.6 + 1.2;
            this.alpha = Math.random() * 0.2 + 0.15;
        } else if (rand < 0.70) {
            this.radius = Math.random() * 1.5 + 3.2;
            this.alpha = Math.random() * 0.2 + 0.25;
        } else if (rand < 0.88) {
            this.radius = Math.random() * 3.0 + 8.5;
            this.alpha = Math.random() * 0.2 + 0.35;
        } else if (rand < 0.96) {
            this.radius = Math.random() * 4.0 + 18.0;
            this.alpha = Math.random() * 0.15 + 0.20;
        } else {
            this.radius = Math.random() * 4.0 + 36.0;
            this.alpha = Math.random() * 0.08 + 0.08;
        }
    }

    drift() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = CONFIG.brandColor;
        ctx.globalAlpha = this.alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function initNodes() {
    nodes = [];
    for (let i = 0; i < CONFIG.particleCount; i++) {
        nodes.push(new SignalNode());
    }
}

function render() {
    ctx.clearRect(0, 0, width, height);
    nodes.forEach(node => {
        if (isDrifting) node.drift();
        node.draw();
    });
    requestAnimationFrame(render);
}

/* ==========================================================================
   SAFE GSAP TYPEWRITER ENGINE WITH SLOWER CINEMATIC PACING & AXIS ALIGNMENT
   ========================================================================== */
function buildAnimationSequence() {
    if (masterTL) masterTL.kill();

    const dict = I18N[currentLang];

    // Populate static text nodes according to current language
    const mindCtaText = document.getElementById("mind-cta-text");
    const mindCtaAction = document.getElementById("mind-cta-action");
    const replayBtn = document.getElementById("replay-btn");

    if (mindCtaText) mindCtaText.innerHTML = dict.ctaText;
    if (mindCtaAction) mindCtaAction.innerHTML = dict.ctaAction;
    if (replayBtn) replayBtn.innerText = dict.replayBtn;

    const epPath = document.getElementById("ep-symbol-path");
    const planiPath = document.getElementById("plani-wordmark-path");
    const dot = document.getElementById("signature-dot");
    const svg = document.getElementById("eplani-svg");
    const grid = document.getElementById("blueprint-grid");

    const hudContainer = document.getElementById("hud-container");
    const hudMeta = document.getElementById("hud-meta");
    const hudStatus = document.getElementById("hud-status");
    const hudText = document.getElementById("hud-text");
    const typeCursor = document.getElementById("type-cursor");

    const portalSphere = document.getElementById("orange-portal-sphere");
    const mindOverlay = document.getElementById("mind-space-overlay");
    const mindLogo = document.getElementById("mind-logo-svg");
    const mindText = document.getElementById("mind-text");
    const mindCursor = document.getElementById("mind-cursor");
    const mCtaWrap = document.getElementById("m-cta-wrap");

    function prepare(path) {
        if (!path) return;
        const length = path.getTotalLength();
        gsap.set(path, {
            strokeDasharray: length,
            strokeDashoffset: length,
            fillOpacity: 0
        });
    }

    prepare(epPath);
    prepare(planiPath);

    isDrifting = true;
    initNodes();
    document.body.classList.remove("in-mind-space");
    
    // SAFE TARGET FILTERING
    const safeHideTargets = [svg, grid, mindOverlay, portalSphere, mCtaWrap, replayBtn].filter(Boolean);
    gsap.set(safeHideTargets, { opacity: 0 });
    
    if (mindOverlay) gsap.set(mindOverlay, { visibility: "hidden" });
    if (hudContainer) gsap.set(hudContainer, { opacity: 0, y: 10 });
    if (dot) gsap.set(dot, { attr: { cx: CONFIG.coords.epDot.x, r: 6 } });

    masterTL = gsap.timeline({ delay: 0.8 });

    // TYPEWRITER FOR HUD READOUTS
    function addTypewriterStep(tl, meta, status, textContent, holdTime = 3.0) {
        tl.call(() => {
            if (hudMeta) hudMeta.innerText = meta;
            if (hudStatus) hudStatus.innerText = status;
            if (hudText) hudText.innerText = "";
            if (typeCursor) typeCursor.classList.add("active");
        });

        tl.to({}, {
            duration: textContent.length * 0.048,
            ease: "none",
            onUpdate: function() {
                if (hudText) {
                    const count = Math.floor(this.progress() * textContent.length);
                    hudText.innerText = textContent.substring(0, count);
                }
            }
        });

        tl.to({}, { duration: holdTime });

        if (hudText) {
            tl.to(hudText, {
                opacity: 0,
                y: -8,
                duration: 0.6,
                ease: "power2.in",
                onComplete: () => {
                    hudText.innerText = "";
                    gsap.set(hudText, { opacity: 1, y: 0 });
                    if (typeCursor) typeCursor.classList.remove("active");
                }
            });
        }
    }

    // CINEMATIC TYPEWRITER FOR MIND SPACE MANIFESTO
    function addMindStep(tl, textContent, holdTime = 4.5) {
        tl.call(() => {
            if (mindText) {
                mindText.innerText = "";
                gsap.set(mindText, { opacity: 1, y: 0 });
            }
            if (mindCursor) mindCursor.classList.add("active");
        });

        tl.to({}, {
            duration: textContent.length * 0.078,
            ease: "none",
            onUpdate: function() {
                if (mindText) {
                    const count = Math.floor(this.progress() * textContent.length);
                    mindText.innerText = textContent.substring(0, count);
                }
            }
        });

        tl.to({}, { duration: holdTime });

        if (mindText) {
            tl.to(mindText, {
                opacity: 0,
                y: -8,
                duration: 0.8,
                ease: "power2.in",
                onComplete: () => {
                    mindText.innerText = "";
                    if (mindCursor) mindCursor.classList.remove("active");
                }
            });
        }
    }

    // 1. Reveal HUD Readout Container
    if (hudContainer) {
        masterTL.to(hudContainer, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out" });
    }

    // 2. Readout Steps using Active Dictionary
    addTypewriterStep(masterTL, dict.hudMeta[0], dict.hudStatus[0], dict.hudText[0], 2.5);
    addTypewriterStep(masterTL, dict.hudMeta[1], dict.hudStatus[1], dict.hudText[1], 2.8);
    addTypewriterStep(masterTL, dict.hudMeta[2], dict.hudStatus[2], dict.hudText[2], 2.2);
    addTypewriterStep(masterTL, dict.hudMeta[3], dict.hudStatus[3], dict.hudText[3], 2.5);

    // 3. Foundation & Drift
    masterTL.call(() => {
        nodes.forEach(node => {
            gsap.to(node, {
                vx: (width / 2 - node.x) * 0.0006,
                vy: (height / 2 - node.y) * 0.0006,
                duration: 7,
                ease: "sine.inOut"
            });
        });
    });

    addTypewriterStep(masterTL, dict.hudMeta[4], dict.hudStatus[4], dict.hudText[4], 3.5);

    // Fade HUD
    if (hudContainer) {
        masterTL.to(hudContainer, { opacity: 0, y: -10, duration: 0.8, ease: "power2.in" });
    }

    // 4. GRID SNAP & AXIS ALIGNMENT (IZGARADAN TEK EKSEN HATLARINA TOPLANMA)
    masterTL.call(() => { isDrifting = false; });
    if (grid) {
        masterTL.to(grid, { opacity: 0.6, duration: 2.2, ease: "power2.out" });
    }

    // 4A: Snap nodes to nearest grid intersections
    masterTL.to(nodes, {
        x: (i, node) => Math.round(node.x / CONFIG.gridSize) * CONFIG.gridSize,
        y: (i, node) => Math.round(node.y / CONFIG.gridSize) * CONFIG.gridSize,
        alpha: 0.85,
        duration: 1.8,
        ease: "expo.out"
    });

    masterTL.to({}, { duration: 0.5 });

    // 4B: Gather nodes onto the horizontal & vertical axes passing through the target dot (Eksen Toplanması)
    masterTL.to(nodes, {
        x: (i, node) => {
            const pt = getPointInScreenPixels(CONFIG.coords.epDot.x, CONFIG.coords.epDot.y);
            return (i % 2 === 0) ? pt.x : Math.round(node.x / CONFIG.gridSize) * CONFIG.gridSize;
        },
        y: (i, node) => {
            const pt = getPointInScreenPixels(CONFIG.coords.epDot.x, CONFIG.coords.epDot.y);
            return (i % 2 !== 0) ? pt.y : Math.round(node.y / CONFIG.gridSize) * CONFIG.gridSize;
        },
        alpha: 0.95,
        duration: 1.6,
        ease: "power3.inOut"
    });

    masterTL.to({}, { duration: 0.4 });

    // 5. CIRCUIT COLLAPSE TO EXACT EP DOT POSITION
    masterTL.to(nodes, {
        x: () => getPointInScreenPixels(CONFIG.coords.epDot.x, CONFIG.coords.epDot.y).x,
        y: () => getPointInScreenPixels(CONFIG.coords.epDot.x, CONFIG.coords.epDot.y).y,
        radius: 3.0,
        alpha: 1,
        duration: 1.8,
        ease: "power2.in"
    });

    // 6. DRAW SVG LOGO
    masterTL.call(() => {
        if (svg) gsap.set(svg, { opacity: 1 });
        if (dot) gsap.set(dot, { attr: { r: 6 } });
        gsap.to(canvas, { opacity: 0, duration: 0.2 });
    });

    if (epPath && dot && planiPath) {
        masterTL.to(epPath, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" })
                .to(dot, { attr: { r: 40 }, duration: 1.2, ease: "power2.out" }, "-=1.8")
                .to(epPath, { fillOpacity: 1, duration: 1.0 }, "-=0.5")
                .to(dot, { attr: { cx: CONFIG.coords.finalDot.x }, duration: 1.8, ease: "expo.inOut" }, "+=0.2")
                .to(planiPath, { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, "-=1.4")
                .to(planiPath, { fillOpacity: 1, duration: 1.0 }, "-=0.5");
    }

    masterTL.call(() => {
        if (dot) gsap.to(dot, { attr: { r: 44 }, duration: 2.2, repeat: -1, yoyo: true, ease: "sine.inOut" });
        const glowBlur = document.getElementById("glow-blur");
        if (glowBlur) gsap.to(glowBlur, { attr: { stdDeviation: 12 }, duration: 2.2, repeat: -1, yoyo: true, ease: "sine.inOut" });
    });

    masterTL.to({}, { duration: 1.2 });

    // 7. HARDWARE PORTAL EXPANSION
    let requiredScale = 60;
    masterTL.call(() => {
        const pt = getPointInScreenPixels(CONFIG.coords.finalDot.x, CONFIG.coords.finalDot.y);
        const maxDist = Math.max(
            Math.hypot(pt.x, pt.y),
            Math.hypot(width - pt.x, pt.y),
            Math.hypot(pt.x, height - pt.y),
            Math.hypot(width - pt.x, height - pt.y)
        );
        requiredScale = (maxDist / 40) * 1.25;

        if (portalSphere) {
            gsap.set(portalSphere, {
                left: pt.x + "px",
                top: pt.y + "px",
                opacity: 1,
                scale: 1
            });
        }
    });

    if (portalSphere) {
        masterTL.to(portalSphere, {
            scale: () => requiredScale,
            duration: 1.5,
            ease: "expo.inOut"
        });
    }

    // 8. LOCK MIND OVERLAY PERMANENTLY
    masterTL.call(() => {
        if (mindOverlay) gsap.set(mindOverlay, { opacity: 1, visibility: "visible" });
        const backdropHide = [svg, grid, portalSphere].filter(Boolean);
        gsap.set(backdropHide, { opacity: 0 });
        document.body.classList.add("in-mind-space");
    });

    if (mindLogo) {
        masterTL.to(mindLogo, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out" }, "+=0.2");
    }

    // 9. CINEMATIC MIND SPACE MANIFESTO READOUTS (FROM DICTIONARY)
    addMindStep(masterTL, dict.mindText[0], 4.2);
    addMindStep(masterTL, dict.mindText[1], 4.8);
    addMindStep(masterTL, dict.mindText[2], 5.0);

    // Sequence 4 (Reality - Final Statement)
    const finalStr = dict.mindText[3];

    masterTL.call(() => {
        if (mindText) {
            mindText.innerText = "";
            gsap.set(mindText, { opacity: 1, y: 0 });
        }
        if (mindCursor) mindCursor.classList.add("active");
    });

    masterTL.to({}, {
        duration: finalStr.length * 0.082,
        ease: "none",
        onUpdate: function() {
            if (mindText) {
                const count = Math.floor(this.progress() * finalStr.length);
                mindText.innerText = finalStr.substring(0, count);
            }
        }
    });

    masterTL.to({}, { duration: 1.8 });

    masterTL.call(() => {
        if (mindCursor) mindCursor.classList.remove("active");
    });

    // 10. REVEAL STRUCTURED HUB & REPLAY CONTROL
    if (mCtaWrap) masterTL.to(mCtaWrap, { opacity: 1, y: 0, duration: 1.4, ease: "power2.out" });
    if (replayBtn) masterTL.to(replayBtn, { opacity: 1, duration: 1.0 }, "-=1.0");
}

/* ==========================================================================
   INIT, LANGUAGE TOGGLE & REPLAY CONTROLS
   ========================================================================== */
window.addEventListener("resize", resizeCanvas);

window.addEventListener("DOMContentLoaded", () => {
    resizeCanvas();
    initNodes();
    render();

    buildAnimationSequence();

    // Language Toggle Listeners
    const btnEn = document.getElementById("lang-en");
    const btnTr = document.getElementById("lang-tr");

    function switchLanguage(lang) {
        if (currentLang === lang) return;
        currentLang = lang;

        if (lang === 'en') {
            btnEn.classList.add('active');
            btnTr.classList.remove('active');
        } else {
            btnTr.classList.add('active');
            btnEn.classList.remove('active');
        }

        const targets = [document.getElementById("mind-space-overlay"), document.getElementById("orange-portal-sphere")].filter(Boolean);
        gsap.to(targets, {
            opacity: 0,
            duration: 0.6,
            onComplete: () => {
                const mindOverlay = document.getElementById("mind-space-overlay");
                if (mindOverlay) gsap.set(mindOverlay, { visibility: "hidden" });
                buildAnimationSequence();
            }
        });
    }

    if (btnEn) btnEn.addEventListener("click", () => switchLanguage('en'));
    if (btnTr) btnTr.addEventListener("click", () => switchLanguage('tr'));

    const replayBtn = document.getElementById("replay-btn");
    if (replayBtn) {
        replayBtn.addEventListener("click", () => {
            const targets = [document.getElementById("mind-space-overlay"), document.getElementById("orange-portal-sphere")].filter(Boolean);
            gsap.to(targets, {
                opacity: 0,
                duration: 0.8,
                onComplete: () => {
                    const mindOverlay = document.getElementById("mind-space-overlay");
                    if (mindOverlay) gsap.set(mindOverlay, { visibility: "hidden" });
                    buildAnimationSequence();
                }
            });
        });
    }
});
</script>
